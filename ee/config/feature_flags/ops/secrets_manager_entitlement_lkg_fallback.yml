---
name: secrets_manager_entitlement_lkg_fallback
description: Kill switch for the Secrets Manager entitlement resilience path. Disabling
  it restores the pre-19.4 behaviour without touching the secrets_manager_paid_experience
  flag. A CustomersDot transport failure then stops replaying the last-known-good slot.
  SecretsManagement::Entitlement.for fails closed to ineligible, and still counts and
  logs the resolution under source fail_closed. Entitlement.for! raises to its caller
  and records neither, as it did before the slot existed. The 2s default HTTP timeout
  on .for also goes back to the Gitlab::HTTP defaults. The slot is still written on
  every live resolution, so re-enabling serves straight away.
feature_issue_url: https://gitlab.com/gitlab-org/gitlab/-/work_items/622853
introduced_by_url: https://gitlab.com/gitlab-org/gitlab/-/merge_requests/254445
rollout_issue_url:
milestone: '19.4'
group: group::secrets manager application
type: ops
default_enabled: true
