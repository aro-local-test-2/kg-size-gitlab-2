---
description: An AI catalog item (agent or flow) is executed.
internal_events: true
status: active
action: trigger_ai_catalog_item
classification: duo
identifiers:
- project
- user
additional_properties:
  label:
    description: (legacy) Type of AI catalog item. Superseded by item_type.
  property:
    description: Indicates the trigger type of the execution.
  value:
    description: (legacy) ID of the AI catalog item. Superseded by custom_item_id.
  foundational_item_ref:
    description: (legacy) Reference identifier of the foundational AI catalog item,
      extracted from its Global ID. Superseded by flow_name and component_name.
  item_type:
    description: Item type. One of foundational_flow, foundational_external_agent,
      foundational_agent, custom_flow, custom_agent, custom_external_agent.
  item_version:
    description: Semantic version of the item (e.g. "1.0.0").
  item_schema_version:
    description: Flow Schema version (e.g. "v1").
  custom_item_id:
    description: Custom item ID.
  flow_name:
    description: Foundational flow name.
  component_name:
    description: Foundational agent reference (e.g. "chat", "orbit_agent").
  tools:
    description: Comma-separated built-in tool names used by the item.
  mcp_tools:
    description: Comma-separated MCP tool names used by the item.
  mcp_servers:
    description: Comma-separated MCP server IDs used by the item.
  components:
    description: Comma-separated component types defined in the flow.
product_group: ai_catalog
product_categories:
- ai_catalog_curation
milestone: '18.4'
introduced_by_url: https://gitlab.com/gitlab-org/gitlab/-/merge_requests/203415
tiers:
- premium
- ultimate
