---
description: Secrets Manager access was denied because of the namespace's entitlement
  state (for example an expired trial or exhausted credits). Fired once per denied
  request from whichever denial layer rejects first.
internal_events: true
status: active
action: secrets_manager_access_denied
identifiers:
- namespace
- user
additional_properties:
  label:
    description: Structured denial reason. One of ineligible, trial_required, trial_expired,
      credits_exhausted, on_demand_disabled, grace, subscription_grace_period_expired.
  property:
    description: Surface where the denial was rejected. One of graphql_mutation,
      graphql_resolver, internal_api, ci_runner_payload, service_gate, other.
  state:
    description: Entitlement state at denial time. One of ineligible, blocked, trial_eligible.
  mode:
    description: Whether the denial was enforced (enforce) or only recorded (observe).
      Always enforce until observe mode ships.
product_group: secrets_manager_application
product_categories:
- secrets_management
milestone: '19.3'
introduced_by_url: https://gitlab.com/gitlab-org/gitlab/-/merge_requests/245606
tiers:
- premium
- ultimate
