---
description: Tracks duo agent platform session creation
internal_events: true
status: active
action: agent_platform_session_created
classification: duo
identifiers:
  - project
  - namespace
  - user
additional_properties:
  label:
    description: Flow type, eg. chat
  property:
    description: Environment, eg. web
  value:
    description: Session id
  source:
    description: >-
      Where the session was triggered from. Mirrors the workflow's source_type:
      an external system (slack, mcp), a GitLab feature entry point
      (e.g. merge_request_code_conflict) or the client surface that created it
      (duo_cli_interactive, duo_cli_run, duo_cli_acp, ide_extension).
  verification_run:
    description: Whether the session is a functional verification run, not real user activity. Verification runs are not billed.
product_group: agent_execution
product_categories:
  - duo_agent_platform
milestone: '18.3'
introduced_by_url: https://gitlab.com/gitlab-org/gitlab/-/merge_requests/201505
tiers:
  - premium
  - ultimate
