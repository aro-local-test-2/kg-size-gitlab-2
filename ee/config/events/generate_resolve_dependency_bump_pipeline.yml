---
description: Tracks the outcome of a pipeline generated by the resolve dependency bump breaking changes resolution workflow.
internal_events: true
status: active
action: generate_resolve_dependency_bump_pipeline
identifiers:
  - project
additional_properties:
  label:
    description: Status of the generated pipeline, e.g. success or failed.
  value:
    description: Id of the merge request the workflow was triggered for.
  property:
    description: Id of the workflow that generated the pipeline.
  pipeline_id:
    description: Id of the pipeline whose completion is being recorded. A pipeline
      can complete more than once, for example when it is retried or resumed after
      a manual job, so use this to count distinct pipelines.
product_group: composition_analysis
product_categories:
  - dependency_management
milestone: '19.3'
introduced_by_url: https://gitlab.com/gitlab-org/gitlab/-/merge_requests/246152
tiers:
  - ultimate
classification: duo
