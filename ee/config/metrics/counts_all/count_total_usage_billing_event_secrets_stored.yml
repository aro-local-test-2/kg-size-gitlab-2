---
key_path: counts.count_total_usage_billing_event_secrets_stored
description: >-
  Total count of secrets_stored billing events emitted through the
  Gitlab::BillingEvents::Client. Emitted daily, one event per root namespace
  with stored secrets. Used as an operational signal to detect whether the
  Secrets Manager billing pipeline is active.
product_group: secrets_manager_application
product_categories:
- secrets_management
performance_indicator_type: []
value_type: number
status: active
milestone: '19.2'
introduced_by_url: https://gitlab.com/gitlab-org/gitlab/-/merge_requests/244291
time_frame:
- 28d
- 7d
- all
data_source: internal_events
data_category: optional
tiers:
- premium
- ultimate
events:
- name: usage_billing_event
  filter:
    property: secrets_stored
