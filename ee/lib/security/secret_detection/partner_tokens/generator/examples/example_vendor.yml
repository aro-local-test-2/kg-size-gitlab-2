# Example vendor definition: the reviewed output of the AI-assisted rule development
# process for a fictional vendor. An LLM reads the vendor's validation-API docs
# and emits this data; a human reviews it; the generator turns it into a
# verifier + spec (see VendorDefinition for the contract and validations).
#
# One file describes one token type. A vendor with several token types gets one
# definition (and one generated client class) per type, so every client verifies
# exactly the format it accepts -- and each type carries its own full endpoint,
# the way GitHub's hand-written verifiers use a different path per type.
---
token_type: "Acme API token"
class_name: "AcmeClient"
endpoint: "https://api.acme.dev/v1/whoami"
http_method: "get"
auth_style: "bearer"
token_pattern: '\Aacme_[a-z0-9]{20}\z'
rate_limit_key: "partner_acme_api"
doc_url: "https://docs.acme.dev/api/authentication"
# Map a code only when it always means that outcome for this vendor. Unmapped
# codes fall through to unknown. A vendor whose codes depend on the response
# body (OpenAI returns 401 for live keys as well as dead ones) needs a
# hand-written client instead of a generated one.
status_map:
  "200": "active"
  "401": "inactive"
  "429": "rate_limit"
  "500": "network_error"
  "502": "network_error"
  "503": "network_error"
