---
title: GitLab Duo and SDLC trends
description: Visualize Duo usage and development trends side-by-side.
version: '2'
constraints:
  data:
    - clickhouse
panels:
- title: "GitLab Duo users"
  visualization:
    type: SingleStat
    data:
      type: ai_impact_over_time
      query:
        metric: duo_used_count
    options: {}
  gridAttributes:
    yPos: 0
    xPos: 0
    width: 4
    height: 1
- title: "GitLab Duo power users"
  visualization:
    type: SingleStat
    data:
      type: ai_impact_over_time
      query:
        metric: duo_power_users_count
    options: {}
  gridAttributes:
    yPos: 0
    xPos: 4
    width: 4
    height: 1
  options: {}
- title: "GitLab Duo agent/flow users"
  visualization:
    type: SingleStat
    data:
      type: ai_impact_over_time
      query:
        metric: duo_agent_platform_agent_flows_users_count
    options: {}
  gridAttributes:
    yPos: 0
    xPos: 8
    width: 4
    height: 1
  options: {}
- title: "GitLab Duo Agent Chat sessions"
  visualization:
    type: SingleStat
    data:
      type: ai_impact_over_time
      query:
        metric: duo_agent_platform_chats
    options: {}
  gridAttributes:
    yPos: 1
    xPos: 0
    width: 4
    height: 1
  options: {}
- title: "Pipelines using GitLab Duo features"
  visualization:
    type: SingleStat
    data:
      type: ai_impact_over_time
      query:
        metric: duo_pipelines_rate
    options:
      unit: percent
      decimalPlaces: 1
  gridAttributes:
    yPos: 1
    xPos: 4
    width: 4
    height: 1
  options: {}
- title: "GitLab Duo Agent Platform flow usage"
  visualization:
    type: DataTable
    data:
      type: ai_agent_platform_flow_metrics
      query:
        sortBy: sessionsCount
        sortDesc: true
    options:
      refetchOnSort: true
      fields:
      - key: flowType
        label: Flow
        sortable: true
      - key: sessionsCount
        label: Number of sessions
        sortable: true
        thAlignRight: true
        thClass: gl-text-right
        tdClass: gl-text-right
      - key: medianExecutionTime
        label: Median duration (min)
        sortable: true
        thAlignRight: true
        thClass: gl-text-right
        tdClass: gl-text-right
        component: FormatNumber
      - key: usersCount
        label: Unique users
        sortable: true
        thAlignRight: true
        thClass: gl-text-right
        tdClass: gl-text-right
      - key: completionRate
        label: Completion rate (%)
        thAlignRight: true
        thClass: gl-text-right
        sortable: true
        tdClass: gl-text-right
  gridAttributes:
    yPos: 2
    xPos: 0
    width: 8
    height: 4
  options: {}
- title: "Pipelines using GitLab Duo Agent Platform over time"
  visualization:
    type: LineChart
    data:
      type: finished_pipelines_using_dap_over_time
      query: {}
    options:
      xAxis:
        name: Month
        type: category
      yAxis:
        name: Pipelines
        type: value
      includeLegendAvgMax: false
      chartTooltip:
        valueUnit: COUNT
  gridAttributes:
    yPos: 2
    xPos: 8
    width: 4
    height: 4
  options: {}
- title: "Returning GitLab Duo users by feature"
  visualization:
    type: LineChart
    data:
      type: duo_feature_user_retention_over_time
      query: {}
    options:
      xAxis:
        name: Date
        type: time
      yAxis:
        name: "User retention (%)"
        type: value
        valueUnit: PERCENT
      includeLegendAvgMax: false
      chartTooltip:
        titleFormatter: DATE
        valueUnit: PERCENT
  gridAttributes:
    yPos: 6
    xPos: 0
    width: 12
    height: 4
  options: {}
- title: "GitLab Duo usage metrics for the %{namespaceName} %{namespaceType}"
  visualization:
    type: AiImpactTable
    data:
      type: value_stream
      query:
        filters:
          includeMetrics:
          - duo_used_count
          - code_suggestions_users_count
          - code_suggestions_acceptance_rate
          - duo_chat_users_count
          - duo_rca_users_count
          - duo_review_requests_count
          - duo_review_comment_count
          - duo_agent_platform_flows
          - duo_agent_platform_chats
    options: {}
  gridAttributes:
    yPos: 10
    xPos: 0
    width: 12
    height: 5
  options: {}
- title: "Development metrics for the %{namespaceName} %{namespaceType}"
  visualization:
    type: AiImpactTable
    data:
      type: value_stream
      query:
        filters:
          includeMetrics:
          - deployment_frequency
          - merge_request_throughput
          - median_time_to_merge
          - contributor_count
          - vulnerability_critical
    options: {}
  gridAttributes:
    yPos: 15
    xPos: 0
    width: 12
    height: 3
  options: {}
- title: "Pipeline metrics for the %{namespaceName} %{namespaceType}"
  visualization:
    type: AiImpactTable
    data:
      type: value_stream
      query:
        filters:
          includeMetrics:
          - pipeline_count
          - pipeline_duration_median
          - pipeline_success_rate
          - pipeline_failed_rate
          - pipeline_other_rate
    options: {}
  gridAttributes:
    yPos: 18
    xPos: 0
    width: 12
    height: 3
  options: {}
- title: "GitLab Duo usage by user"
  visualization:
    type: DataTable
    data:
      type: user_ai_usage_data
      query:
        sortBy: totalEventCount
        sortDesc: true
    options:
      refetchOnSort: true
      fields:
      - key: user
        component: UserLink
      - key: totalEventCount
        label: Total events
        thAlignRight: true
        tdClass: gl-text-right
        sortable: true
  gridAttributes:
    yPos: 21
    xPos: 0
    width: 4
    height: 4
- title: "GitLab Duo Code Review usage by user"
  visualization:
    type: DataTable
    data:
      type: user_ai_usage_data
      query:
        sortBy: requestReviewDuoCodeReviewOnMrByAuthorEventCount
        sortDesc: true
    options:
      refetchOnSort: true
      fields:
      - key: user
        component: UserLink
      - key: requestReviewDuoCodeReviewOnMrByAuthorEventCount
        label: Reviews requested
        thAlignRight: true
        tdClass: gl-text-right
        sortable: true
      - key: duoCodeReviewCommentsReactedTo
        label: Reactions to review comments
        thAlignRight: true
        tdClass: gl-text-right
  gridAttributes:
    yPos: 21
    xPos: 4
    width: 4
    height: 4
- title: "GitLab Duo Root Cause Analysis usage by user"
  visualization:
    type: DataTable
    data:
      type: user_ai_usage_data
      query:
        sortBy: troubleshootJobEventCount
        sortDesc: true
    options:
      refetchOnSort: true
      fields:
      - key: user
        component: UserLink
      - key: troubleshootJobEventCount
        label: Usage
        thAlignRight: true
        tdClass: gl-text-right
        sortable: true
  gridAttributes:
    yPos: 21
    xPos: 8
    width: 4
    height: 4
- title: Flows usage by user
  visualization:
    type: DataTable
    data:
      type: ai_agent_platform_flows_usage_by_user
      query: {}
    options:
      fields:
      - key: user
        component: UserLink
      - key: flowType
        label: Flow name
      - key: sessionsCount
        label: Number of times triggered
        thClass: gl-text-right
        tdClass: gl-text-right
  gridAttributes:
    yPos: 25
    xPos: 0
    width: 6
    height: 4
  options: {}
- title: "GitLab Duo Code Suggestions usage by user"
  visualization:
    type: DataTable
    data:
      type: user_ai_usage_data
      query:
        sortBy: codeSuggestionShownInIdeEventCount
        sortDesc: true
    options:
      refetchOnSort: true
      fields:
      - key: user
        component: UserLink
      - key: codeSuggestionShownInIdeEventCount
        label: Suggestions shown
        thAlignRight: true
        thClass: gl-w-1/20 gl-text-right
        tdClass: gl-text-right
        sortable: true
      - key: codeSuggestionAcceptedInIdeEventCount
        label: Suggestions accepted
        thAlignRight: true
        thClass: gl-w-1/20 gl-text-right
        tdClass: gl-text-right
        sortable: true
      - key: codeSuggestionsAcceptanceRate
        label: Acceptance rate (%)
        component: CalculatePercent
        thAlignRight: true
        thClass: gl-text-right
        tdClass: gl-text-right
  gridAttributes:
    yPos: 25
    xPos: 6
    width: 6
    height: 4
- title: "GitLab Duo Code Suggestions acceptance by language"
  visualization:
    type: BarChart
    data:
      type: code_suggestions_acceptance_by_language
      query: {}
    options:
      xAxis:
        name: Suggestions accepted
        type: value
      yAxis:
        name: ''
        type: category
      chartTooltip:
        titleFormatter: VALUE_ONLY
        valueUnit: COUNT
        contextualData:
        - key: shownCount
          label: Suggestions shown
          unit: COUNT
        - key: acceptanceRate
          label: Acceptance rate
          unit: PERCENT
  gridAttributes:
    yPos: 29
    xPos: 0
    width: 4
    height: 3
  options: {}
- title: "GitLab Duo Code Suggestions acceptance by IDE"
  visualization:
    type: BarChart
    data:
      type: code_suggestions_acceptance_by_ide
      query: {}
    options:
      xAxis:
        name: Suggestions accepted
        type: value
      yAxis:
        name: ''
        type: category
      chartTooltip:
        titleFormatter: VALUE_ONLY
        valueUnit: COUNT
        contextualData:
        - key: shownCount
          label: Suggestions shown
          unit: COUNT
        - key: acceptanceRate
          label: Acceptance rate
          unit: PERCENT
  gridAttributes:
    yPos: 29
    xPos: 4
    width: 4
    height: 3
  options: {}
- title: "GitLab Duo Code Review requests by role"
  visualization:
    type: StackedColumnChart
    data:
      type: code_review_requests_by_role_over_time
      query:
        dateRange: 180d
    options:
      xAxis:
        name: Month
        type: category
      yAxis:
        name: GitLab Duo Code Review Requests
        type: value
      chartTooltip:
        valueUnit: COUNT
      presentation: tiled
      includeLegendAvgMax: false
  gridAttributes:
    yPos: 29
    xPos: 8
    width: 4
    height: 3
  options: {}
- title: "GitLab Duo Code Review comments sentiment"
  visualization:
    type: AreaChart
    data:
      type: code_review_comments_sentiment_over_time
      query:
        dateRange: 180d
    options:
      xAxis:
        name: Month
        type: category
      yAxis:
        name: ''
        type: value
      chartTooltip:
        valueUnit: PERCENT
      includeLegendAvgMax: false
  gridAttributes:
    yPos: 32
    xPos: 0
    width: 6
    height: 4
  options: {}
- title: "Code generation volume trends"
  visualization:
    type: AreaChart
    data:
      type: code_generation_volume_over_time
      query:
        dateRange: 180d
    options:
      xAxis:
        name: Month
        type: category
      yAxis:
        name: Lines of Code
        type: value
      includeLegendAvgMax: false
      chartTooltip:
        valueUnit: COUNT
  gridAttributes:
    yPos: 32
    xPos: 6
    width: 6
    height: 4
  options: {}
