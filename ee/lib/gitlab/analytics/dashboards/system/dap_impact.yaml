        query:
          glql: |
            display: stat
            mode: analytics
            query: type = DuoWorkflow and flowType in ("resolve_sast_vulnerability/v1", "sast_fp_detection/v1") and created >= "%{startDate}" and created <= "%{endDate}"
            metrics: totalCount
            displayConfig:
              unit: sessions
              description: Sessions of the SAST flows
    gridAttributes:
      yPos: 347
      xPos: 6
      width: 6
      height: 14
  - title: Suggestions posted
    tooltip:
      description: Fix suggestions that Duo posted on failed pipelines in the selected date range.
