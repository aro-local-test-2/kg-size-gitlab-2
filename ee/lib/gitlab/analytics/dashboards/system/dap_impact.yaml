            display: stat
            mode: analytics
            query: type = AiUsageEvent and event = "fix_pipeline_suggestion_posted" and timestamp >= "%{startDate}" and timestamp <= "%{endDate}"
            metrics: totalCount
            displayConfig:
              description: ""
    gridAttributes:
      yPos: 361
      xPos: 0
      width: 3
      height: 12
  - title: Suggestions applied
    tooltip:
      description: Posted fix suggestions that were applied in the selected date range.
    visualization:
      type: Glql
      options:
        showActions: false
      data:
        type: glql
        query:
          glql: |
            display: stat
            mode: analytics
            query: type = AiUsageEvent and event = "fix_pipeline_suggestion_applied" and timestamp >= "%{startDate}" and timestamp <= "%{endDate}"
            metrics: totalCount
            displayConfig:
              description: ""
    gridAttributes:
      yPos: 361
      xPos: 3
      width: 3
      height: 12
  - title: MRs created after finding vulnerability
    tooltip:
      description: Merge requests opened by Resolve SAST Vulnerability sessions created in the selected date range.
    visualization:
      type: Glql
      options:
        showActions: false
      data:
        type: glql
        query:
          glql: |
            display: stat
            mode: analytics
            query: type = DuoWorkflow and flowType = "resolve_sast_vulnerability/v1" and created >= "%{startDate}" and created <= "%{endDate}"
            metrics: createdMrCountSum
            displayConfig:
              description: ""
