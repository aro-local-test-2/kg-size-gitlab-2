  # TODO: alias each event as its own metric and switch to a line chart once totalCount can filter
  # by event: https://gitlab.com/gitlab-org/gitlab/-/work_items/629550
  - title: Agentic Fix Pipeline suggestions over time
    tooltip:
      description: Fix suggestions that Duo posted on failed pipelines in the selected date range, and those that were applied, per period.
    visualization:
      type: Glql
      options:
        showActions: false
      data:
        type: glql
        query:
          glql: |
            display: columnChart
            mode: analytics
            query: type = AiUsageEvent and event in ("fix_pipeline_suggestion_posted", "fix_pipeline_suggestion_applied") and timestamp >= "%{startDate}" and timestamp <= "%{endDate}"
            dimensions: timestamp(%{dynamicGranularity}), event
            metrics: totalCount as "Suggestions"
            sort: timestamp asc
    gridAttributes:
      yPos: 373
      xPos: 0
      width: 6
      height: 50
  - title: Agentic SAST sessions over time
    tooltip:
      description: SAST flow sessions created over the selected period, and the merge requests those sessions opened.
    visualization:
      type: Glql
      options:
        showActions: false
      data:
        type: glql
        query:
          glql: |
            display: lineChart
            mode: analytics
            query: type = DuoWorkflow and flowType in ("resolve_sast_vulnerability/v1", "sast_fp_detection/v1") and created >= "%{startDate}" and created <= "%{endDate}"
            dimensions: created(%{dynamicGranularity})
            metrics: totalCount as "Sessions created", createdMrCountSum as "MRs created after finding vulnerability"
            sort: created asc
    gridAttributes:
      yPos: 373
      xPos: 6
      width: 6
      height: 50
- title: Spend
  duoPrompts:
  - Which model is costing us the most credits?
  - How are credits trending, excluding Chat?
  - Which capabilities drive spend on each model?
  - Why is Chat excluded from the credits chart?
  panels:
  # Totals all credits for now; narrows to model-attributed credits once modelUsed
  # is filterable, which is when this and the Credits tile diverge.
  - title: Credits by model
    visualization:
      type: Glql
      options:
        showActions: false
        showTrends: true
      data:
        type: glql
        query:
          glql: |
            display: stat
            mode: analytics
            query: type = DuoWorkflow and created >= "%{startDate}" and created <= "%{endDate}"
            metrics: creditsUsedSum
            displayConfig:
              compact: true
              unit: credits
    gridAttributes:
      yPos: 0
      xPos: 0
      width: 12
      height: 17
  # The top capabilities get their own stacked segment and legend entry; the rest roll
  # into an Other segment.
  - title: Credits by model, by capability
    visualization:
      type: Glql
      options:
        showActions: false
      data:
        type: glql
        query:
          glql: |
            display: barList
            mode: analytics
            query: type = DuoWorkflow and created >= "%{startDate}" and created <= "%{endDate}"
            dimensions: model, flowType
            metrics: creditsUsedSum
            displayConfig:
              maxSeries: 5
    gridAttributes:
      yPos: 17
      xPos: 0
      width: 12
      height: 38
  - title: Credits
    visualization:
      type: Glql
      options:
        showActions: false
      data:
        type: glql
        query:
          glql: |
            display: stat
            mode: analytics
            query: type = DuoWorkflow and created >= "%{startDate}" and created <= "%{endDate}"
            metrics: creditsUsedSum
            displayConfig:
              compact: true
              unit: credits
              description: Total credits consumed over the selected period
    gridAttributes:
      yPos: 55
      xPos: 0
      width: 6
      height: 17
  - title: Chat
    visualization:
      type: Glql
      options:
        showActions: false
        showTrends: true
      data:
        type: glql
        query:
          glql: |
            display: stat
            mode: analytics
            # chat and agentic chat are the two chat session flow types on this source
            query: type = DuoWorkflow and flowType in ("chat", "agentic_chat/v1") and created >= "%{startDate}" and created <= "%{endDate}"
            metrics: creditsUsedSum
            displayConfig:
              compact: true
              unit: credits
              description: Credits consumed by Chat sessions
    gridAttributes:
      yPos: 55
      xPos: 6
      width: 6
      height: 17
  - title: Credits over time
    visualization:
      type: Glql
      options:
        showActions: false
      data:
        type: glql
        query:
          glql: |
            display: columnChart
            mode: analytics
            query: type = DuoWorkflow and created >= "%{startDate}" and created <= "%{endDate}"
            dimensions: created(%{dynamicGranularity}), flowType
            metrics: creditsUsedSum
            # the second key orders the stacked segments largest-first within each bucket
            sort: created asc, creditsUsedSum desc
    gridAttributes:
      yPos: 72
      xPos: 0
      width: 12
      height: 50
