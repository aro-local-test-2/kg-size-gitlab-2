# @feature_category: mcp_server
query listGroupWikiPages($fullPath: ID!, $first: Int, $after: String) {
  group(fullPath: $fullPath) {
    id
    wikiPages(first: $first, after: $after) {
      nodes {
        id
        title
        slug
        webUrl
      }
      pageInfo {
        endCursor
      }
    }
  }
}
