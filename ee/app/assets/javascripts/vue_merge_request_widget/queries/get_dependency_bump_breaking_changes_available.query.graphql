# @feature_category: continuous_integration
query getDependencyBumpBreakingChangesAvailable($projectPath: ID!, $iid: String!) {
  project(fullPath: $projectPath) {
    id
    mergeRequest(iid: $iid) {
      id
      duoDependencyBumpBreakingChangesAvailable @gl_introduced(version: "19.2.0")
    }
  }
}
