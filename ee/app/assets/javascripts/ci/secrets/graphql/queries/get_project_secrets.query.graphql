# @feature_category: secrets_management
query getProjectSecrets($fullPath: ID!, $first: Int!) {
  secretsList: projectSecrets(projectPath: $fullPath, first: $first) {
    edges {
      node {
        branch
        createdAt
        description
        environment
        metadataVersion
        name
        project {
          id
        }
        rotationInfo {
          rotationIntervalDays
          status
        }
        status
      }
    }
  }
}
