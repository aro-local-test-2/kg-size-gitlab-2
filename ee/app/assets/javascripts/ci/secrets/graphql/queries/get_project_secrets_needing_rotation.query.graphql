# @feature_category: secrets_management
query getProjectSecretsNeedingRotation($fullPath: ID!) {
  secretsNeedingRotation: projectSecretsNeedingRotation(projectPath: $fullPath) {
    nodes {
      name
      rotationInfo {
        rotationIntervalDays
        status
        nextReminderAt
        lastReminderAt
      }
    }
  }
}
