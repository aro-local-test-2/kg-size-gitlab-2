# @feature_category: secrets_management
query getGroupSecrets($fullPath: ID!, $first: Int!) {
  secretsList: groupSecrets(groupPath: $fullPath, first: $first) {
    edges {
      node {
        createdAt
        description
        environment
        metadataVersion
        name
        protected
        rotationInfo {
          rotationIntervalDays
          status
        }
        status
        group {
          id
          fullPath
        }
      }
    }
  }
}
