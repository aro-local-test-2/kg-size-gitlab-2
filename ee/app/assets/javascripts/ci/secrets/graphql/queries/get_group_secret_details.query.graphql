# @feature_category: secrets_management
query getGroupSecretDetails($fullPath: ID!, $name: String!) {
  secret: groupSecret(name: $name, groupPath: $fullPath) {
    description
    environment
    metadataVersion
    name
    protected
    status
    rotationInfo {
      rotationIntervalDays
      status
      nextReminderAt
    }
  }
}
