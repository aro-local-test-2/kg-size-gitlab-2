# @feature_category: secrets_management
query getSecretDetails($fullPath: ID!, $name: String!) {
  secret: projectSecret(name: $name, projectPath: $fullPath) {
    branch
    description
    environment
    metadataVersion
    name
    status
    rotationInfo {
      rotationIntervalDays
      status
      nextReminderAt
    }
  }
}
