# @feature_category: secrets_management
query getGroupSecretsNeedingRotation($fullPath: ID!) {
  secretsNeedingRotation: groupSecretsNeedingRotation(groupPath: $fullPath) {
    nodes {
      name
      rotationInfo {
        rotationIntervalDays
        status
        nextReminderAt
        lastReminderAt
      }
    }
  }
}
