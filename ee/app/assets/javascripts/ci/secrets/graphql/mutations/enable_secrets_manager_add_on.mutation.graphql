# @feature_category: secrets_management
mutation enableSecretsManagerAddOn($groupPath: ID!) {
  secretsManagerEnableAddOn(input: { groupPath: $groupPath }) {
    entitlement {
      state
      blockedReason
      trialStartedAt
      trialExpiresAt
      creditsRemaining
      creditsTotal
      onDemandEnabled
    }
    errors
  }
}
