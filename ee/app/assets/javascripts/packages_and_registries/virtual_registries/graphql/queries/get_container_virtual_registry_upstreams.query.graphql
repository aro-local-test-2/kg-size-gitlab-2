# @feature_category: virtual_registry

query getContainerVirtualRegistryUpstreams($id: VirtualRegistriesContainerRegistryID!) {
  registry: virtualRegistriesContainerRegistry(id: $id) {
    id
    registryUpstreams {
      id
      position
      upstream {
        id
        cacheValidityHours
        name
        url
      }
    }
  }
}
