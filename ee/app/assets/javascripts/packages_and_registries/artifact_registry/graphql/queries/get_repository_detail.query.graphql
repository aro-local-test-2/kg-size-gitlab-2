# @feature_category: artifact_registry

# `name` stays selected whatever else the page renders: graphql/cache_config.js keys
# ArtifactRegistryRepository on it, so the cache cannot normalize the entity without it.
query getArtifactRegistryRepositoryDetail(
  $organizationId: OrganizationsOrganizationID!
  $name: String!
) {
  organization(id: $organizationId) {
    id
    artifactRegistryRepository(name: $name) {
      id @gl_introduced(version: "19.5.0")
      name
      format
      kind
      visibility
      description
      artifactsCount
      downloadsCount
      sizeBytes
      createdAt
      lastUpdatedAt
      createdBy {
        id
        name
        avatarUrl
        webPath
      }
      updatedBy {
        id
        name
        avatarUrl
        webPath
      }
      settings {
        url
        cacheValidityHours
        metadataCacheValidityHours
        lastHealthStatus
        lastHealthCheckedAt
      }
      userPermissions {
        updateRepository
        deleteRepository
        deleteArtifact
      }
    }
  }
}
