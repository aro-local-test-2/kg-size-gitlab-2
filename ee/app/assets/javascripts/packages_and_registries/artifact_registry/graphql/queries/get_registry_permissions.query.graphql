# @feature_category: artifact_registry
#import "../fragments/namespace_verdicts.fragment.graphql"

query getArtifactRegistryPermissions($organizationId: OrganizationsOrganizationID!) {
  organization(id: $organizationId) {
    id
    artifactRegistry {
      id @gl_introduced(version: "19.5.0")
      userPermissions {
        ...ArtifactRegistryNamespaceVerdicts
      }
    }
  }
}
