# @feature_category: secrets_management
mutation enableInstanceSecretsManagerAddOn {
  secretsManagerInstanceEnableAddOn(input: {}) {
    entitlement {
      state
      blockedReason
      trialStartedAt
      trialExpiresAt
      creditsRemaining
      creditsTotal
      onDemandEnabled
      offlineLicense
    }
    errors
  }
}
