#import "~/graphql_shared/fragments/page_info.fragment.graphql"

query getSubscriptionUsersUsage(
  $namespacePath: ID
  $first: Int
  $last: Int
  $after: String
  $before: String
  $searchQuery: String
  $sort: GitlabSubscriptionUsageUserSort
) {
  subscriptionUsage(namespacePath: $namespacePath) {
    usersUsage {
      users(
        first: $first
        last: $last
        after: $after
        before: $before
        sort: $sort
        searchQuery: $searchQuery
      ) {
        nodes {
          id
          name
          username
          avatarUrl
          usage {
            creditsUsed
            totalCredits
            monthlyCommitmentCreditsUsed
            overageCreditsUsed
            monthlyWaiverCreditsUsed
            paidTierTrialCreditsUsed
          }
          blockedStatus @gl_introduced(version: "18.11.0") {
            blocked
          }
        }
        pageInfo {
          ...PageInfo
        }
      }
    }
  }
}
