# @feature_category: security_testing_configuration
query GroupToolCoverage($fullPath: ID!) {
  group(fullPath: $fullPath) {
    id
    webPath
    descendantGroups(includeParentDescendants: true, archived: false) {
      count
    }
    analyzerStatuses {
      analyzerType
      success
      failure
      stale
      notConfigured
      totalProjectsCount
      updatedAt
    }
  }
}
