# @feature_category: portfolio_management
mutation updateBoardEpicUserPreferences(
  $boardId: BoardID!
  $epicId: EpicID!
  $collapsed: Boolean!
) {
  updateBoardEpicUserPreferences(
    input: { boardId: $boardId, epicId: $epicId, collapsed: $collapsed }
  ) {
    errors
    epicUserPreferences {
      collapsed
    }
  }
}
