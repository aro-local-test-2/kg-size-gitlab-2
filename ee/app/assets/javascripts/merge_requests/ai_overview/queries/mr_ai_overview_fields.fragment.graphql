fragment MrAiOverviewFields on MergeRequest {
  id
  state
  conflicts
  approvalsRequired: groupedApprovalsRequired
  approvalsLeft: groupedApprovalsLeft
  resolvableDiscussionsCount
  resolvedDiscussionsCount
  mergeabilityChecks {
    identifier
    status
  }
  headPipeline {
    id
    path
    detailedStatus {
      id
      text
    }
  }
}
