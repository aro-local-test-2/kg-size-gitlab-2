query approvalSummary($projectPath: ID!, $iid: String!) {
  project(fullPath: $projectPath) {
    id
    mergeRequest(iid: $iid) {
      id
      approved
      approvalsLeft: groupedApprovalsLeft
      approvalsRequired: groupedApprovalsRequired
      approvedBy {
        nodes {
          id
        }
      }
      approvalState {
        rules {
          id
          approved
          approvalsRequired
          name
          type
        }
      }
    }
  }
}
