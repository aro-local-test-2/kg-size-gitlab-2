#import "~/graphql_shared/fragments/page_info.fragment.graphql"
#import "~/graphql_shared/fragments/label.fragment.graphql"

# Top-level `restWorkItems @client` field is intercepted by the Apollo local resolver
# (restWorkItemsResolver in work_items_rest_resolver.js), which fetches from the work items REST API.
# Isolated from Query.namespace to prevent cache broadcast conflicts.
# @feature_category: portfolio_management
query getWorkItemsRestEE(
  $includeDescendants: Boolean = true
  $iid: String
  $fullPath: ID!
  $isGroup: Boolean
  $search: String
  $sort: WorkItemSort
  $state: IssuableState
  $assigneeWildcardId: AssigneeWildcardId
  $assigneeUsernames: [String!]
  $authorUsername: String
  $closedAfter: Time
  $closedBefore: Time
  $confidential: Boolean
  $createdAfter: Time
  $createdBefore: Time
  $dueAfter: Time
  $dueBefore: Time
  $labelName: [String!]
  $milestoneTitle: [String!]
  $milestoneWildcardId: MilestoneWildcardId
  $myReactionEmoji: String
  $subscribed: SubscriptionStatus
  $workItemTypeIds: [WorkItemsTypeID!]
  $updatedAfter: Time
  $updatedBefore: Time
  $crmOrganizationId: String
  $crmContactId: String
  $releaseTag: [String!]
  $releaseTagWildcardId: ReleaseTagWildcardId
  $hierarchyFilters: HierarchyFilterInput
  $in: [IssuableSearchableField!]
  $not: NegatedWorkItemFilterInput
  $or: UnionedWorkItemFilterInput
  $afterCursor: String
  $beforeCursor: String
  $firstPageSize: Int
  $lastPageSize: Int
  $customField: [WorkItemWidgetCustomFieldFilterInputType!]
  $weight: String
  $weightWildcardId: WeightWildcardId
  $healthStatusFilter: HealthStatusFilter
  $status: WorkItemWidgetStatusFilterInput
  $iterationId: [ID]
  $iterationWildcardId: IterationWildcardId
  $iterationCadenceId: [IterationsCadenceID!]
  $ids: [WorkItemID!]
) {
  namespace(fullPath: $fullPath) {
    id
    fullPath
    name
  }
  restWorkItems(
    isGroup: $isGroup
    fullPath: $fullPath
    ids: $ids
    iid: $iid
    includeDescendants: $includeDescendants
    search: $search
    sort: $sort
    state: $state
    assigneeUsernames: $assigneeUsernames
    assigneeWildcardId: $assigneeWildcardId
    authorUsername: $authorUsername
    closedAfter: $closedAfter
    closedBefore: $closedBefore
    confidential: $confidential
    createdAfter: $createdAfter
    createdBefore: $createdBefore
    dueBefore: $dueBefore
    dueAfter: $dueAfter
    labelName: $labelName
    milestoneTitle: $milestoneTitle
    milestoneWildcardId: $milestoneWildcardId
    myReactionEmoji: $myReactionEmoji
    subscribed: $subscribed
    workItemTypeIds: $workItemTypeIds
    updatedAfter: $updatedAfter
    updatedBefore: $updatedBefore
    crmContactId: $crmContactId
    crmOrganizationId: $crmOrganizationId
    releaseTag: $releaseTag
    releaseTagWildcardId: $releaseTagWildcardId
    hierarchyFilters: $hierarchyFilters
    in: $in
    not: $not
    or: $or
    after: $afterCursor
    before: $beforeCursor
    first: $firstPageSize
    last: $lastPageSize
    customField: $customField
    weight: $weight
    weightWildcardId: $weightWildcardId
    healthStatusFilter: $healthStatusFilter
    status: $status
    iterationId: $iterationId
    iterationWildcardId: $iterationWildcardId
    iterationCadenceId: $iterationCadenceId
  ) @client {
    pageInfo {
      ...PageInfo
    }
    nodes {
      id
      author {
        id
        avatarUrl
        name
        username
        webPath
        webUrl
      }
      closedAt
      confidential
      createdAt
      hidden
      iid
      userDiscussionsCount
      namespace {
        id
        fullPath
      }
      reference(full: true)
      title
      titleHtml
      updatedAt
      webPath
      webUrl
      state
      widgets(
        onlyTypes: [
          LABELS
          ASSIGNEES
          MILESTONE
          START_AND_DUE_DATE
          STATUS
          HEALTH_STATUS
          WEIGHT
          ITERATION
          HIERARCHY
          LINKED_ITEMS
          AWARD_EMOJI
          DEVELOPMENT
        ]
      ) {
        type
        ... on WorkItemWidgetLabels {
          allowsScopedLabels
          labels {
            nodes {
              ...Label
            }
          }
        }
        ... on WorkItemWidgetAssignees {
          assignees {
            nodes {
              id
              avatarUrl
              name
              username
              webUrl
              webPath
            }
          }
        }
        ... on WorkItemWidgetMilestone {
          milestone {
            id
            dueDate
            startDate
            title
            webPath
          }
        }
        ... on WorkItemWidgetStartAndDueDate {
          dueDate
          startDate
        }
        ... on WorkItemWidgetStatus {
          status {
            id
            category
            color
            description
            iconName
            position
            name
          }
        }
        ... on WorkItemWidgetHealthStatus {
          healthStatus
        }
        ... on WorkItemWidgetWeight {
          weight
        }
        ... on WorkItemWidgetIteration {
          iteration {
            id
            title
            startDate
            dueDate
            webUrl
            iterationCadence {
              id
              title
            }
          }
        }
        ... on WorkItemWidgetHierarchy {
          parent {
            id
            iid
            title
            titleHtml
            confidential
            webUrl
            namespace {
              id
              fullPath
            }
            workItemType {
              id
              name
              iconName
            }
          }
        }
        ... on WorkItemWidgetLinkedItems {
          blockingCount
          blockedByCount
        }
        ... on WorkItemWidgetAwardEmoji {
          upvotes
          downvotes
        }
        ... on WorkItemWidgetDevelopment {
          closingMergeRequests {
            count
          }
        }
      }
      features {
        labels {
          allowsScopedLabels
          labels {
            nodes {
              ...Label
            }
          }
        }
        assignees {
          assignees {
            nodes {
              id
              avatarUrl
              name
              username
              webUrl
              webPath
            }
          }
        }
        milestone {
          milestone {
            id
            dueDate
            startDate
            title
            webPath
          }
        }
        startAndDueDate {
          dueDate
          startDate
        }
        status {
          status {
            id
            category
            color
            description
            iconName
            position
            name
          }
        }
        healthStatus {
          healthStatus
        }
        weight {
          weight
        }
        iteration {
          iteration {
            id
            title
            startDate
            dueDate
            webUrl
            iterationCadence {
              id
              title
            }
          }
        }
        hierarchy {
          parent {
            id
            iid
            title
            titleHtml
            confidential
            webUrl
            namespace {
              id
              fullPath
            }
            workItemType {
              id
              name
              iconName
            }
          }
        }
        linkedItems {
          blockingCount
          blockedByCount
        }
        awardEmoji {
          upvotes
          downvotes
        }
        development {
          closingMergeRequests {
            count
          }
        }
      }
      workItemType {
        id
        name
        iconName
      }
    }
  }
}
