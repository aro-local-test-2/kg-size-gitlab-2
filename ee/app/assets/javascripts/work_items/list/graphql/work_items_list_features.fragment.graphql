#import "~/work_items/list/graphql/base_work_items_list_features.fragment.graphql"

fragment WorkItemsListFeatures on WorkItemFeatures {
  ...BaseWorkItemsListFeatures
  healthStatus {
    healthStatus
  }
  weight {
    weight
  }
  linkedItems {
    blockedByCount
    blockingCount
  }
  iteration {
    iteration {
      id
      title
      startDate
      dueDate
      webUrl
      iterationCadence {
        id
        title
      }
    }
  }
  status {
    status {
      id
      color
      description
      iconName
      name
    }
  }
}
