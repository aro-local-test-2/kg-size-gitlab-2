#import "~/graphql_shared/fragments/label.fragment.graphql"
#import "~/graphql_shared/fragments/user.fragment.graphql"
#import "~/work_items/graphql/milestone.fragment.graphql"
#import "./work_item_status.fragment.graphql"

fragment WorkItemMetadataWidgets on WorkItemWidget {
  type
  ... on WorkItemWidgetStartAndDueDate @skip(if: $useWorkItemFeatures) {
    dueDate
    startDate
  }
  ... on WorkItemWidgetWeight @skip(if: $useWorkItemFeatures) {
    weight
    rolledUpWeight
  }
  ... on WorkItemWidgetProgress @skip(if: $useWorkItemFeatures) {
    progress
    updatedAt
  }
  ... on WorkItemWidgetHealthStatus @skip(if: $useWorkItemFeatures) {
    healthStatus
    rolledUpHealthStatus {
      count
      healthStatus
    }
  }
  ... on WorkItemWidgetMilestone @skip(if: $useWorkItemFeatures) {
    milestone {
      ...MilestoneFragment
    }
  }
  ... on WorkItemWidgetAssignees @skip(if: $useWorkItemFeatures) {
    allowsMultipleAssignees
    canInviteMembers
    assignees {
      nodes {
        ...User
      }
    }
  }
  ... on WorkItemWidgetLabels @skip(if: $useWorkItemFeatures) {
    allowsScopedLabels
    labels {
      nodes {
        ...Label
      }
    }
  }
  ... on WorkItemWidgetLinkedItems {
    blockedByCount
    blockingCount
  }
  ... on WorkItemWidgetIteration @skip(if: $useWorkItemFeatures) {
    iteration {
      id
      title
      startDate
      dueDate
      webUrl
      iterationCadence {
        id
        title
      }
    }
  }

  ... on WorkItemWidgetStatus @skip(if: $useWorkItemFeatures) {
    status {
      ...WorkItemStatusFragment
    }
  }
}
