#import "~/graphql_shared/fragments/page_info.fragment.graphql"

# @feature_category: team_planning
query workItemVulnerabilities(
  $fullPath: ID!
  $iid: String!
  $first: Int = 25
  $after: String = ""
  $useWorkItemFeatures: Boolean = false
) {
  namespace(fullPath: $fullPath) {
    id
    workItem(iid: $iid) {
      id
      iid
      namespace {
        id
      }
      widgets @skip(if: $useWorkItemFeatures) {
        ... on WorkItemWidgetVulnerabilities {
          type
          relatedVulnerabilities(first: $first, after: $after) {
            nodes {
              id
              state
              severity
              name
              webUrl
            }
            pageInfo {
              ...PageInfo
            }
            count
          }
        }
      }
      features @include(if: $useWorkItemFeatures) {
        vulnerabilities {
          type
          relatedVulnerabilities(first: $first, after: $after) {
            nodes {
              id
              state
              severity
              name
              webUrl
            }
            pageInfo {
              ...PageInfo
            }
            count
          }
        }
      }
    }
  }
}
