#import "ee_else_ce/work_items/graphql/work_item_types_configuration.fragment.graphql"
# @feature_category: team_planning
mutation createWorkItemType($input: WorkItemTypeCreateInput!) {
  workItemTypeCreate(input: $input) {
    workItemType {
      ...WorkItemTypesConfiguration
      isFilterableBoardView
      isFilterableListView
    }
    errors
  }
}
