# @feature_category: duo_agent_platform
#import "~/graphql_shared/fragments/user.fragment.graphql"

fragment DuoAgentSession on DuoWorkflow {
  id
  title
  status
  humanStatus
  createdAt
  updatedAt
  workflowDefinition
  user @gl_introduced(version: "19.1.0") {
