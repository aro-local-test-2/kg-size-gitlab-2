# @feature_category: workflow_catalog
#import "~/graphql_shared/fragments/page_info.fragment.graphql"
#import "../fragments/ai_catalog_mcp_server.fragment.graphql"

query aiCatalogMcpServers($before: String, $after: String, $first: Int, $last: Int) {
  aiCatalogMcpServers(before: $before, after: $after, first: $first, last: $last) {
    nodes {
      ...BaseAiCatalogMcpServer
    }
    pageInfo {
      ...PageInfo
    }
  }
}
