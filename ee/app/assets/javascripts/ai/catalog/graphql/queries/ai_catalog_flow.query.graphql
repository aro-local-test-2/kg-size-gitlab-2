# @feature_category: workflow_catalog
#import "../fragments/ai_catalog_item.fragment.graphql"
#import "../fragments/ai_catalog_flow_version.fragment.graphql"
#import "../fragments/service_account.fragment.graphql"

query aiCatalogFlow(
  $id: AiCatalogItemID!
  $showSoftDeleted: Boolean
  $projectId: ProjectID!
  $hasProject: Boolean = false
  $groupId: GroupID!
  $hasGroup: Boolean = false
) {
  aiCatalogItem(id: $id, showSoftDeleted: $showSoftDeleted) {
    ...BaseAiCatalogItem
    isEnabledInManagedByProject
    project {
      id
      name
      nameWithNamespace
      webUrl
      rootGroup @gl_introduced(version: "18.6.0") {
        id
        fullName
        fullPath
      }
      userPermissions {
        createAiCatalogItemConsumer @gl_introduced(version: "19.3.0")
      }
    }
    latestVersion {
      ...BaseAiCatalogFlowVersion
    }
    configurationForProject(projectId: $projectId) @include(if: $hasProject) {
      id
      enabled
      flowTriggers @gl_introduced(version: "19.4.0") {
        id
        active
        eventTypes
        filter
        user {
          ...BaseServiceAccount
        }
      }
      pinnedItemVersion {
        ...BaseAiCatalogFlowVersion
      }
      userPermissions {
        adminAiCatalogItemConsumer
      }
    }
    configurationForGroup(groupId: $groupId) @include(if: $hasGroup) {
      id
      enabled
      group {
        id
        duoSettingsPath
      }
      serviceAccount {
        ...BaseServiceAccount
      }
      pinnedItemVersion {
        ...BaseAiCatalogFlowVersion
      }
      userPermissions {
        adminAiCatalogItemConsumer
      }
    }
  }
}
