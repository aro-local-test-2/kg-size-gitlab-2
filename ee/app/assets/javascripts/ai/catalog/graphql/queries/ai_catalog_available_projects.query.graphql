# @feature_category: ai_catalog_curation
#import "~/graphql_shared/fragments/page_info.fragment.graphql"

query aiCatalogAvailableProjects(
  $itemId: AiCatalogItemID!
  $search: String!
  $after: String = ""
  $before: String = ""
  $first: Int
  $last: Int
  $searchNamespaces: Boolean = false
  $sort: String
  $membership: Boolean = true
  $minAccessLevel: AccessLevelEnum
  $duoLicensedFeature: DuoLicensedFeature
) {
  projects(
    search: $search
    after: $after
    before: $before
    first: $first
    last: $last
    membership: $membership
    minAccessLevel: $minAccessLevel
    searchNamespaces: $searchNamespaces
    sort: $sort
    duoLicensedFeature: $duoLicensedFeature
  ) {
    nodes {
      id
      name
      nameWithNamespace
      aiCatalogItemConsumerForItem(id: $itemId) @gl_introduced(version: "19.0.0") {
        id
        enabled
      }
      webPath
    }
    pageInfo {
      ...PageInfo
    }
    count(limit: 100)
  }
}
