# @feature_category: workflow_catalog
#import "~/graphql_shared/fragments/page_info.fragment.graphql"

query projectMcpServers(
  $projectId: ProjectID!
  $before: String
  $after: String
  $first: Int
  $last: Int
) {
  aiCatalogConfiguredItems(
    projectId: $projectId
    itemTypes: [AGENT]
    before: $before
    after: $after
    first: $first
    last: $last
  ) {
    nodes {
      id
      item {
        id
        name
        latestVersion {
          id
          ... on AiCatalogAgentVersion {
            mcpServers {
              nodes {
                id
                name
                description
                url
                homepageUrl
                transport
                authType
                currentUserConnected
              }
            }
          }
        }
      }
    }
    pageInfo {
      ...PageInfo
    }
  }
}
