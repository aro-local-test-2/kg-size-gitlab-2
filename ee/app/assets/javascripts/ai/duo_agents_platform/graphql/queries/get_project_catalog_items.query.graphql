# @feature_category: ai_catalog_curation
#import "~/graphql_shared/fragments/page_info.fragment.graphql"
#import "ee/ai/catalog/graphql/fragments/ai_catalog_item.fragment.graphql"

query projectAiCatalogTabItems(
  $projectPath: ID!
  $itemTypes: [AiCatalogItemType!]
  $before: String
  $after: String
  $first: Int
  $last: Int
  $search: String
  $sort: AiCatalogItemsSort
) {
  project(fullPath: $projectPath) {
    id
    aiCatalogItems(
      itemTypes: $itemTypes
      allAvailable: true
      before: $before
      after: $after
      first: $first
      last: $last
      search: $search
      sort: $sort
    ) {
      nodes {
        ...BaseAiCatalogItem
        project {
          id
          nameWithNamespace
        }
      }
      pageInfo {
        ...PageInfo
      }
    }
  }
}
