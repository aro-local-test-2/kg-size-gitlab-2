#import "../fragments/vulnerabilities_per_severity.fragment.graphql"

query projectVulnerabilitiesPerSeverity(
  $fullPath: ID!
  $reportType: [VulnerabilityReportType!]
  $trackedRefIds: [SecurityProjectTrackedContextID!]
) {
  namespace: project(fullPath: $fullPath) {
    id
    securityMetrics(reportType: $reportType, trackedRefIds: $trackedRefIds) {
      vulnerabilitiesPerSeverity {
        ...VulnerabilitiesPerSeverity
      }
    }
  }
}
