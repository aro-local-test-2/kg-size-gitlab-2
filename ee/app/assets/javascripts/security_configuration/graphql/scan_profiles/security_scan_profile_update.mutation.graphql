#import "./scan_profile.fragment.graphql"

# @feature_category: security_testing_configuration
mutation SecurityScanProfileUpdate($input: SecurityScanProfileUpdateInput!) {
  securityScanProfileUpdate(input: $input) {
    clientMutationId
    errors
    scanProfile {
      ...ScanProfileFields
      triggerSettings {
        triggerType
        configuration {
          ... on SecretDetectionConfiguration {
            secureAnalyzersPrefix
            imageSuffix
            historicScan
            logOptions
            excludedPaths
            rulesetGitReference
          }
        }
      }
    }
  }
}
