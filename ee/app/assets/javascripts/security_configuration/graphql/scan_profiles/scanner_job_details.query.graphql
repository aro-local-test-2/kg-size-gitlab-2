# @feature_category: security_testing_configuration

query getJobDetails($fullPath: ID!, $id: JobID!) {
  project(fullPath: $fullPath) {
    id
    job(id: $id) {
      id
      name
      status
      failureMessage
      webPath
      duration
      finishedAt
      trace {
        htmlSummary
      }
      pipeline {
        path
        id
      }
    }
  }
}
