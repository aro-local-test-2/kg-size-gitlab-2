#import "./scan_profile.fragment.graphql"

# @feature_category: security_testing_configuration
query SecurityScanProfile($id: SecurityScanProfileID!) {
  securityScanProfile(id: $id) {
    ...ScanProfileFields
    triggerSettings {
      triggerType
      configuration {
        ... on SecretDetectionConfiguration {
          secureAnalyzersPrefix
          imageSuffix
          historicScan
          logOptions
          excludedPaths
          rulesetGitReference
        }
      }
    }
  }
}
