---
version: '2'
title: Dashboard Example Inline Vis
description: North Star Metrics across all departments for the last 3 quarters.
filters:
  excludeAnonymousUsers:
    enabled: true
  dateRange:
    enabled: true
panels:
  - title: Overall Conversion Rate
    gridAttributes:
      yPos: 4
      xPos: 1
      width: 12
      height: 2
    visualization:
      slug: inline_line_chart
      type: LineChart
      options:
        xAxis:
          name: Date
          type: time
        yAxis:
          name: Number of deployments
          type: value
      data:
        type: dora_metrics
        query:
          metric: deployment_frequency
          dateRange: 180d
          interval: DAILY
    queryOverrides:
      timeDimensions:
        - dimension: Stories.time
          dateRange:
            - '2016-01-01'
            - '2016-02-30'
          granularity: month
